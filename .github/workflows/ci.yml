name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atendimento
          POSTGRES_USER: atendimento
          POSTGRES_PASSWORD: senha-de-teste-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atendimento -d atendimento"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DB: atendimento
      POSTGRES_USER: atendimento
      POSTGRES_PASSWORD: senha-de-teste-ci
      DB_HOST: localhost

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B verify