spring.application.name=atendimento
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5

classificador.provedor=${CLASSIFICADOR_PROVEDOR:simulado}
reprocessamento.automatico=${REPROCESSAMENTO_AUTOMATICO:true}
reprocessamento.intervalo-ms=${REPROCESSAMENTO_INTERVALO_MS:60000}

springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:true}